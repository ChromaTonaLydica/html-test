  });
  const modalCells=[
    {text:'L Y D I A N',start:2,end:2},
    {text:'MIXOLYDIAN',start:3,end:4,split:true},
    {text:'AEOLIAN',start:5,end:6,split:true},
    {text:'LOCRIAN',start:7,end:8,split:true},
    {text:'IONIAN',start:9,end:10,split:true},
    {text:'D O R I A N',start:11,end:11},
    {text:'PHRYGIAN',start:12,end:13,split:true}
  ];
  function splitModalName(text){const raw=[...text];let cut=Math.ceil(raw.length/2);if(text==='MIXOLYDIAN')cut=5;if(text==='PHRYGIAN')cut=4;return [raw.slice(0,cut).map(ch=>ch+' ').join('').trim(),raw.slice(cut).map(ch=>ch+' ').join('').trim()]}
  modalCells.forEach(m=>{
    if(!m.split){h+='<div class="modal" style="grid-column:'+m.start+';grid-column-end:'+(m.end+1)+'">'+esc(m.text)+'</div>';return;}
    const [a,b]=splitModalName(m.text);
    h+='<div class="modal modal-half-first" style="grid-column:'+m.start+';grid-row:3;border-right:0">'+esc(a)+'</div>';
    h+='<div class="modal modal-half-second" style="grid-column:'+m.end+';grid-row:3">'+esc(b)+'</div>';
  });
  document.getElementById('head').innerHTML=h;
  document.getElementById('keySelect').onchange=e=>{state.key=e.target.value;renderHead();renderUpper();renderLower()};
}
function renderUpper(){let out='';DATA.families.forEach((fam,fi)=>{out+=`<div class="label">${esc(fam.short)}</div>`;for(let ci=0;ci<12;ci++){const avail=familyHasStructureAt(fi,ci),cls=['cell'];if(ci===0)cls.push('i');if(ci===9)cls.push('vi');if([1,3,5,8,10].includes(ci))cls.push('col-muted');if(!avail)cls.push('empty');if(state.selectedUpper&&state.selectedUpper.fi===fi&&state.selectedUpper.ci===ci)cls.push('upper-selected');out+=`<div class="${cls.join(' ')}" data-family="${fi}" data-col="${ci}">${avail?esc(upperDisplay(fi,ci)):''}</div>`}});document.getElementById('upperGrid').innerHTML=out;document.querySelectorAll('#upperGrid .cell:not(.empty)').forEach(c=>c.onclick=()=>selectUpper(+c.dataset.family,+c.dataset.col))}
function renderLower(){
  let out='';
  DATA.families.forEach((fam,fi)=>{
    out+=`<section class="key-block" id="family-${fi}"><div class="section-title">${esc(fam.full)}</div>`;
    out+='<div class="mode-grid lower-modes"><div></div>';
    for(let ci=0;ci<12;ci++){const m=fam.modes.find(x=>x.col===ci);out+=`<div class="mode">${m?esc(m.name):''}</div>`}
    out+='</div><div class="calc-grid lower-calc"><div></div>';
    for(let ci=0;ci<12;ci++){const avail=familyHasStructureAt(fi,ci), val=avail?upperDisplay(fi,ci):'';out+=`<div class="calc-value">${esc(val)}</div>`}
    out+='</div><div class="chord-grid">';
    fam.details.forEach(row=>{out+=`<div class="label">${esc(fam.short)}</div>`;const map=Object.fromEntries(row.cells.map(c=>[c.col,c]));for(let ci=0;ci<12;ci++){const cell=map[ci],cls=['chord'];if(ci===0)cls.push('i');if(ci===9)cls.push('vi');if(!cell)cls.push('empty');else if(cell.structure===state.selectedStructure)cls.push('structure-match');if(cell?.structure===state.selectedStructure&&cell.name===state.selectedChordName)cls.push('selected-chord-name');out+=`<div class="${cls.join(' ')}" data-structure="${esc(cell?.structure||'')}">${cell?esc(cell.name):''}</div>`}});
    out+='</div></section>';
  });
  document.getElementById('lowerScroll').innerHTML=out;
  document.querySelectorAll('#lowerScroll .chord:not(.empty)').forEach(c=>c.onclick=()=>selectLower(c.dataset.structure,c.textContent.trim()));
}
function selectUpper(fi,ci){let found=null;for(const row of DATA.families[fi].details){const c=row.cells.find(x=>x.col===ci&&x.structure===state.selectedStructure);if(c){found=c;break}}if(!found){return}state.selectedUpper={fi,ci};state.selectedChordName=found.name||'--- not available ---';renderTarget();renderUpper();renderLower();requestAnimationFrame(()=>{const lower=document.getElementById('lowerScroll'),block=document.getElementById('family-'+fi);if(lower&&block){const lr=lower.getBoundingClientRect(),br=block.getBoundingClientRect();lower.scrollTo({top:Math.max(0,lower.scrollTop+br.top-lr.top-3),behavior:'smooth'})}})}
function selectLower(mask,name){if(!mask)return;state.selectedStructure=mask;state.selectedChordName=name||'--- not available ---';state.selectedUpper=null;state.checks=(mask.match(/.{2}/g)||[]).map(x=>x!=='--');state.checks[0]=true;renderTarget();renderUpper();renderLower()}
renderTarget();renderHead();renderUpper();renderLower();
document.getElementById('viewSelect').value=state.view;
document.getElementById('viewSelect').onchange=e=>{state.view=e.target.value;renderHead();renderUpper();renderLower()};
</script></body></html>
